name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8 "black==24.8.0"

      - name: Run black (check only)
        run: black --check src/ dags/ tests/

      - name: Run flake8
        run: flake8 src/ dags/ tests/ --max-line-length=120 --exclude=src/dashboard/quality_dashboard.py,src/dashboard/data_catalog.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest
          if [ -f requirements-streamlit.txt ]; then pip install -r requirements-streamlit.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        env:
          PYTHONPATH: src:src/dashboard
        run: pytest tests/ -v