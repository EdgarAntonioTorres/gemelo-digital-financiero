version: "3.8"

# Gemelo Digital Financiero — entorno base de desarrollo
#
# Todas las credenciales se leen desde .env (nunca hardcodeadas aquí).
# Si falta alguna variable, Docker Compose falla al arrancar con un
# mensaje claro, en vez de usar un valor por defecto silencioso.
#
# Servicios:
#   - postgres-airflow : metadata DB de Airflow (interna, no analítica)
#   - postgres-dw       : PostgreSQL analítico con esquemas `gold` y `operational`
#                          (ver sección 6.1 del Contexto Maestro: Bronze/Silver
#                          viven en MinIO, Gold y Operacional en este motor)
#   - minio              : almacenamiento de objetos S3-compatible para Bronze/Silver
#   - minio-init         : crea los buckets bronze/ y silver/ al arrancar
#   - airflow-init        : inicializa la base de metadata y el usuario admin
#   - airflow-webserver / airflow-scheduler : orquestación (LocalExecutor)

x-airflow-common: &airflow-common
  # Se construye la imagen extendida (Dockerfile.airflow) en vez de
  # usar la imagen base directamente — Airflow necesita Java + pyspark +
  # kagglehub instalados para poder correr `spark-submit` dentro del
  # propio contenedor (no existe un servicio `spark` separado, ver §7.1
  # del Contexto Maestro). `image:` le da nombre/tag al resultado del
  # build, para no reconstruir en cada `docker compose up`.
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: gemelo-digital-financiero/airflow:2.9.3-pyspark3.5.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?falta AIRFLOW_DB_USER en .env}:${AIRFLOW_DB_PASSWORD:?falta AIRFLOW_DB_PASSWORD en .env}@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    # Logging nativo de Airflow, configurado explícitamente ---
    # Antes se dejaba en los defaults implícitos de la imagen; ahora queda
    # declarado a propósito, para que quede documentado y sea reproducible
    # (no depende de qué versión de Airflow decida cambiar sus defaults).
    #
    # LOGGING_LEVEL=INFO: mismo nivel que usan los 3 scripts de ingesta
    # (logging.basicConfig(level=logging.INFO, ...)) — así el nivel de
    # detalle es consistente entre lo que loguea Airflow y lo que loguea
    # el propio spark-submit que Airflow invoca.
    AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    # FAB_LOGGING_LEVEL: nivel de log del framework web (Flask-AppBuilder)
    # que sirve la UI — por defecto es WARNING, que puede ocultar errores
    # de autenticación/permisos útiles al depurar. Se sube a INFO por
    # consistencia con el resto.
    AIRFLOW__LOGGING__FAB_LOGGING_LEVEL: "INFO"
    # Formato explícito de las líneas de log de Airflow (scheduler,
    # webserver, y el encabezado que Airflow antepone a cada línea de
    # salida de las tareas). Se elige un formato con timestamp+nivel+
    # logger+mensaje que es legible junto a las líneas que ya imprimen
    # los propios scripts de ingesta (mismo estilo, no idéntico byte a
    # byte porque Airflow no permite quitar sus propios campos internos
    # como %(dag_id)s de este formato).
    AIRFLOW__LOGGING__LOG_FORMAT: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
    # MAX_LOG_AGE_IN_DAYS: el proceso de limpieza nativo de Airflow
    # (airflow-scheduler corre esto automáticamente) borra logs de tareas
    # con más de 15 días. Sin esto, el volumen `airflow-logs` crece sin
    # límite mientras dure el proyecto. 15 días es más que suficiente
    # para un entorno de desarrollo donde las corridas se revisan a los
    # pocos días de ejecutadas, no semanas después.
    AIRFLOW__LOGGING__MAX_LOG_AGE_IN_DAYS: "15"
    # Credenciales / endpoints que consumen los DAGs y jobs de Spark:
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    DW_POSTGRES_HOST: postgres-dw
    DW_POSTGRES_DB: gemelo_digital
    DW_POSTGRES_USER: ${DW_POSTGRES_USER:?falta DW_POSTGRES_USER en .env}
    DW_POSTGRES_PASSWORD: ${DW_POSTGRES_PASSWORD:?falta DW_POSTGRES_PASSWORD en .env}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./tests:/opt/airflow/tests
    - airflow-logs:/opt/airflow/logs
    # kagglehub (usado por los 3 scripts de ingesta) busca el token en
    # ~/.kaggle/access_token del usuario que corre el proceso. Se monta
    # el mismo token que ya configuraste en el host (guía de entorno
    # local §7.1, paso 7) — nada nuevo que generar. El usuario `airflow`
    # dentro del contenedor tiene HOME=/home/airflow.
    # SIN :ro (corregido tras la primera corrida real, 2026-08-21):
    # kagglehub también escribe su propio archivo de log en
    # ~/.kaggle/logs/kagglehub.log — si el mount es de solo lectura,
    # esa escritura falla con PermissionError (no detiene la ingesta,
    # pero ensucia el log). Como es entorno de desarrollo local, no
    # producción, se acepta el mount en lectura/escritura.
    - ${HOME}/.kaggle:/home/airflow/.kaggle
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:

  # --- Metadata DB de Airflow ---
  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?falta AIRFLOW_DB_USER en .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?falta AIRFLOW_DB_PASSWORD en .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # --- Base analítica (capa Gold + esquema Operacional) ---
  postgres-dw:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DW_POSTGRES_USER:?falta DW_POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${DW_POSTGRES_PASSWORD:?falta DW_POSTGRES_PASSWORD en .env}
      POSTGRES_DB: gemelo_digital
    ports:
      - "5433:5432"
    volumes:
      - postgres-dw-data:/var/lib/postgresql/data
      - ./config/init-dw-schemas.sql:/docker-entrypoint-initdb.d/init-dw-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # --- Almacenamiento S3-compatible para Bronze/Silver ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb -p local/bronze;
      mc mb -p local/silver;
      exit 0;
      "

  # --- Airflow ---
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    environment:
      <<: *airflow-common-env
      _AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?falta AIRFLOW_ADMIN_USER en .env}
      _AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?falta AIRFLOW_ADMIN_PASSWORD en .env}
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$$_AIRFLOW_ADMIN_USER" --password "$$_AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-airflow-data:
  postgres-dw-data:
  minio-data:
  airflow-logs: